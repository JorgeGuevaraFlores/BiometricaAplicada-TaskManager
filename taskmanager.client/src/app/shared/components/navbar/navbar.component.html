<nav class="navbar navbar-expand-lg bg-warning shadow-sm">
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <i class="bi bi-check2-square me-2"></i>
      Task Manager
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarPrincipal"
      aria-controls="navbarPrincipal"
      aria-expanded="false"
      aria-label="Mostrar navegación"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="navbarPrincipal" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @if (authService.estaAutenticado()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/tareas" routerLinkActive="active">
              <i class="bi bi-list-check me-1"></i>
              Tareas
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/usuarios"
              routerLinkActive="active"
            >
              <i class="bi bi-people-fill me-1"></i>
              Usuarios
            </a>
          </li>
        }
      </ul>

      <ul class="navbar-nav">
        @if (!authService.estaAutenticado()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">
              <i class="bi bi-box-arrow-in-right me-1"></i>
              Iniciar sesión
            </a>
          </li>
        }

        @if (authService.estaAutenticado()) {
          <button type="button" class="btn btn-danger" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-2"></i>
            Cerrar sesión
          </button>
        }
      </ul>
    </div>
  </div>
</nav>
