<div class="container py-4">
  <div class="mb-4">
    <h2>
      <i class="bi bi-pencil-square me-2 text-warning"></i>
      Editar usuario
    </h2>

    <p class="text-muted">Modifica la información del usuario seleccionado.</p>
  </div>

  @if (cargando) {
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden"> Cargando usuario... </span>
      </div>
    </div>
  } @else if (usuario) {
    <app-usuario-form
      modo="editar"
      [usuario]="usuario"
      (guardarUsuario)="actualizarUsuario($event)"
    >
    </app-usuario-form>
  }
</div>
